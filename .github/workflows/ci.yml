name: CI - Lint, Type Check, Test, Security

on:
  push:
    branches: [ master, main, develop ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ master, main, develop ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  # ===========================================================================
  # Job 1 : Code Quality (Lint + Format + Type Check)
  # ===========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    # Terminate older instances of THIS task on the same branch
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # automatic git clone on VM

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run Ruff linter
      run: ruff check .

    - name: Run Ruff formatter check
      run: ruff format --check .

    - name: Run type checking with mypy
      run: mypy appcore application domain infrastructure
      continue-on-error: true

  # ===========================================================================
  # Job 2 : Tests + Coverage
  # ===========================================================================
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test
      cancel-in-progress: true

    services:
      postgres:
        image: postgres:16
        # The credentials below are used ONLY for the ephemeral CI environment.
        # This database is created on-the-fly and destroyed after the job finishes.
        env:
          POSTGRES_DB: synexify_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: synexify_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: appcore.settings
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[all]
      - name: Run database migrations
        run: python manage.py migrate --run-syncdb
      - name: Run tests with coverage
        run: pytest --cov-report=xml --cov-report=term-missing
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 3

  # ===========================================================================
  # Job 3 : Security Audit (parallel with tests)
  # ===========================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-security
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Run Ruff security checks (bandit rules)
        run: ruff check --select S .
      - name: Audit dependencies for vulnerabilities
        run: |
          pip install pip-audit
          pip-audit
        continue-on-error: true

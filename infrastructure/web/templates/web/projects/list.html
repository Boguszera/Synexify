<!-- # infrastructure/web/templates/web/projects/list.html -->

{% extends "layouts/base.html" %}

{% block title %}Project List{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Projects</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <a href="{% url 'web:project_create' %}" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-plus-lg"></i> New Project
        </a>
    </div>
</div>

<div class="row row-cols-1 row-cols-md-3 g-4">
    {% for project in projects %}
    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ project.get_name }}</h5>
                <p class="card-text text-muted">
                    {{ project.get_description|truncatechars:100 }}
                </p>
            </div>
            <div class="card-footer bg-transparent border-top-0">
                <a href="{% url 'web:project_detail' pk=project.get_id %}" class="btn btn-primary btn-sm w-100">
                    Details
                </a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <div class="alert alert-info">No projects to display.</div>
    </div>
    {% endfor %}
</div>
{% endblock %}

{% extends "layouts/base.html" %}

{% block title %}Nowy Sprint w {{ project.get_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Utwórz nowy Sprint</h3>
            <a href="{% url 'web:project_detail' pk=project.get_id %}" class="btn btn-outline-secondary">Anuluj</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="name" class="form-label">Nazwa Sprintu *</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                        <div class="form-text">Dla projektu: **{{ project.get_name }}**</div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="start_date" class="form-label">Data rozpoczęcia *</label>
                            <input type="date" class="form-control" id="start_date" name="start_date" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="end_date" class="form-label">Data zakończenia *</label>
                            <input type="date" class="form-control" id="end_date" name="end_date" required>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary">Utwórz Sprint</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
